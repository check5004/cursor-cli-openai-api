<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title desc">
  <title id="title">cursor-cli-openai-api</title>
  <desc id="desc">あなたのアプリ（OpenAI SDK）から OpenAI 互換の HTTP でこのブリッジを呼ぶと、Cursor CLI 経由で Cursor のモデルが答える構成図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a3a"/>
      <stop offset="1" stop-color="#1f1147"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="bridgeBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="bridgeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f5c"/>
      <stop offset="1" stop-color="#1a1840"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#a5b4fc"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1280" height="560" rx="28"/></clipPath>
  </defs>

  <style>
    .jp { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", "IPAPGothic", sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", "Cascadia Code", "Consolas", "Menlo", "DejaVu Sans Mono", monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 484px 345px; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="560" fill="url(#bg)"/>
    <rect width="1280" height="560" fill="url(#grid)"/>
    <circle cx="1120" cy="70" r="300" fill="url(#glowPurple)"/>
    <circle cx="120" cy="560" r="300" fill="url(#glowTeal)"/>
  </g>

  <!-- ヘッダー -->
  <g>
    <rect x="56" y="40" width="300" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <circle cx="76" cy="55" r="5" fill="#2dd4bf"/>
    <text x="90" y="60" class="mono" font-size="13" letter-spacing="1.5" fill="#cbd5e1">UNOFFICIAL · LOCAL BRIDGE</text>

    <text x="56" y="130" class="mono" font-size="54" font-weight="700" fill="url(#titleGrad)">cursor-cli-openai-api</text>
    <text x="58" y="180" class="jp" font-size="29" font-weight="700" fill="#e2e8f0">Cursor のサブスクで、OpenAI 互換 API を手元に。</text>
    <text x="58" y="216" class="jp" font-size="18" fill="#94a3b8">API キー発行前でも、OpenAI SDK で書いたアプリを base_url の変更だけで動かしてテストできます。</text>
  </g>

  <!-- コネクター -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="294" y1="345" x2="360" y2="345" stroke="#a5b4fc" class="flow" marker-end="url(#arrow)"/>
    <line x1="606" y1="345" x2="672" y2="345" stroke="#a5b4fc" class="flow" marker-end="url(#arrow)"/>
    <line x1="918" y1="345" x2="984" y2="345" stroke="#a5b4fc" class="flow" marker-end="url(#arrow)"/>
  </g>
  <g class="mono" font-size="12" fill="#a5b4fc" text-anchor="middle">
    <text x="328" y="330">HTTP</text>
    <text x="640" y="330">CLI</text>
    <text x="952" y="330">HTTPS</text>
  </g>

  <!-- 1. あなたのアプリ -->
  <g filter="url(#shadow)">
    <rect x="56" y="268" width="232" height="154" rx="18" fill="#111a33" stroke="#334155"/>
  </g>
  <g transform="translate(80 290)">
    <rect width="44" height="36" rx="7" fill="none" stroke="#7dd3fc" stroke-width="2.5"/>
    <line x1="0" y1="10" x2="44" y2="10" stroke="#7dd3fc" stroke-width="2.5"/>
    <text x="22" y="30" class="mono" font-size="13" font-weight="700" fill="#7dd3fc" text-anchor="middle">&lt;/&gt;</text>
  </g>
  <text x="80" y="356" class="jp" font-size="21" font-weight="700" fill="#f8fafc">あなたのアプリ</text>
  <text x="80" y="382" class="mono" font-size="13" fill="#94a3b8">OpenAI SDK · curl</text>
  <text x="80" y="402" class="mono" font-size="13" fill="#94a3b8">LangChain など</text>

  <!-- 2. ブリッジ（このリポジトリ） -->
  <rect x="362" y="262" width="244" height="166" rx="22" fill="#8b5cf6" opacity="0.35" filter="url(#glow)" class="pulse"/>
  <g filter="url(#shadow)">
    <rect x="368" y="268" width="232" height="154" rx="18" fill="url(#bridgeFill)" stroke="url(#bridgeBorder)" stroke-width="2.5"/>
  </g>
  <g transform="translate(392 290)">
    <path d="M0 30 Q22 2 44 30" fill="none" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="0" y1="30" x2="44" y2="30" stroke="#c4b5fd" stroke-width="3"/>
    <line x1="11" y1="18" x2="11" y2="30" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="22" y1="13" x2="22" y2="30" stroke="#c4b5fd" stroke-width="2"/>
    <line x1="33" y1="18" x2="33" y2="30" stroke="#c4b5fd" stroke-width="2"/>
  </g>
  <text x="448" y="312" class="jp" font-size="12" fill="#c4b5fd">このリポジトリ</text>
  <text x="392" y="356" class="jp" font-size="21" font-weight="700" fill="#ffffff">OpenAI 互換ブリッジ</text>
  <text x="392" y="380" class="mono" font-size="13" fill="#5eead4">localhost:8765/v1</text>
  <g class="mono" font-size="11" fill="#e9d5ff">
    <rect x="390" y="390" width="116" height="21" rx="10.5" fill="#ffffff" fill-opacity="0.08"/>
    <text x="448" y="405" text-anchor="middle">/chat/completions</text>
    <rect x="510" y="390" width="78" height="21" rx="10.5" fill="#ffffff" fill-opacity="0.08"/>
    <text x="549" y="405" text-anchor="middle">/responses</text>
  </g>

  <!-- 3. Cursor CLI -->
  <g filter="url(#shadow)">
    <rect x="680" y="268" width="232" height="154" rx="18" fill="#111a33" stroke="#334155"/>
  </g>
  <g transform="translate(704 290)">
    <rect width="44" height="36" rx="7" fill="#0b1020" stroke="#86efac" stroke-width="2.5"/>
    <path d="M9 12 L17 18 L9 24" fill="none" stroke="#86efac" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="21" y1="25" x2="33" y2="25" stroke="#86efac" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="704" y="356" class="jp" font-size="21" font-weight="700" fill="#f8fafc">Cursor CLI</text>
  <text x="704" y="382" class="mono" font-size="13" fill="#94a3b8">agent -p</text>
  <text x="704" y="402" class="mono" font-size="13" fill="#94a3b8">--mode ask（読み取り専用）</text>

  <!-- 4. Cursor -->
  <g filter="url(#shadow)">
    <rect x="992" y="268" width="232" height="154" rx="18" fill="#111a33" stroke="#334155"/>
  </g>
  <g transform="translate(1016 292)">
    <path d="M10 32 H38 A9 9 0 0 0 36 14 A13 13 0 0 0 11 15 A9 9 0 0 0 10 32 Z" fill="none" stroke="#fcd34d" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="1016" y="356" class="jp" font-size="21" font-weight="700" fill="#f8fafc">Cursor のモデル</text>
  <text x="1016" y="382" class="jp" font-size="13" fill="#94a3b8">あなた（会社）の</text>
  <text x="1016" y="402" class="jp" font-size="13" fill="#94a3b8">サブスクの利用枠で実行</text>

  <!-- フッター: 対応環境 -->
  <g class="jp" font-size="14" fill="#e2e8f0" text-anchor="middle">
    <rect x="56" y="470" width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="112" y="492">Windows</text>
    <rect x="178" y="470" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="222" y="492">WSL</text>
    <rect x="276" y="470" width="96" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="324" y="492">macOS</text>
    <rect x="382" y="470" width="88" height="34" rx="17" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.16"/>
    <text x="426" y="492">Linux</text>
    <rect x="480" y="470" width="226" height="34" rx="17" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="593" y="492" fill="#99f6e4">Python 標準ライブラリのみ</text>
    <rect x="716" y="470" width="200" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="816" y="492" fill="#ddd6fe">ストリーミング対応</text>
  </g>
  <text x="1224" y="492" class="jp" font-size="13" fill="#64748b" text-anchor="end">Cursor・OpenAI とは無関係の非公式ツール</text>
</svg>
